[project]
name = "second-opinion"
version = "0.1.0"
description = "A gateway that gets a second opinion from a different model family before an agent does something it cannot undo."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
